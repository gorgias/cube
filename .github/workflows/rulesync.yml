name: RuleSync

on:
  pull_request:
  push:
    branches: [gorgias]

permissions:
  contents: read

jobs:
  drift:
    runs-on: gh-actions-0.5cpu1gb-runner-set
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated AI configuration
        run: ./scripts/check-rulesync-drift.sh
